# Pulls pre-built images from GitHub Container Registry — published by
# .github/workflows/publish.yml whenever a version tag (vX.Y.Z) is pushed.
# No local build, no Node/npm required on the host. WHARF_VERSION defaults
# to "latest" (the most recently published tag); pin it to a specific
# release (e.g. WHARF_VERSION=v1.2.0) for reproducible deploys.
#
# Building from source instead (e.g. for local development, or before the
# first release is cut)? Use the build overlay:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up
services:
  control-plane:
    image: ghcr.io/${WHARF_IMAGE_OWNER:-drk1rd}/wharf-control-plane:${WHARF_VERSION:-latest}
    ports:
      - "8080:8080"
    environment:
      # Where the control plane's OWN queries reach sibling database containers
      # from inside its own container — the docker host gateway, not "localhost".
      WHARF_PROBE_HOST: host.docker.internal
      # Where connection strings shown to you point — the machine you're running
      # `docker compose up` on. Change this if you're exposing Wharf elsewhere.
      WHARF_PUBLIC_HOST: ${WHARF_PUBLIC_HOST:-localhost}
      WHARF_TOKEN: ${WHARF_TOKEN:-}
      WHARF_DATA_DIR: /data
      # Optional: caps how many instances this control plane will create in
      # total — protects a shared host (e.g. a pilot everyone points at) from
      # one person exhausting it. 0 or unset = no cap.
      WHARF_MAX_INSTANCES: ${WHARF_MAX_INSTANCES:-0}
      # Optional: caps the combined cpu (cores) / memory (MB) reserved across
      # every instance on the host, enforced on create and on live resize —
      # WHARF_MAX_INSTANCES alone doesn't stop one instance from resizing its
      # way to 16 cores/32GB. 0 or unset = no cap on that dimension.
      WHARF_MAX_TOTAL_CPU: ${WHARF_MAX_TOTAL_CPU:-0}
      WHARF_MAX_TOTAL_MEMORY_MB: ${WHARF_MAX_TOTAL_MEMORY_MB:-0}
      # Optional: enables the "ask your data" natural-language query feature via
      # OpenRouter (https://openrouter.ai), letting each user pick their own model
      # in Settings. Leave unset to keep it off — the UI shows a hint instead.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Set to "true" once Wharf is served over HTTPS (e.g. behind a tunnel) so
      # session cookies get the Secure flag. Leave false for plain-HTTP local use.
      WHARF_COOKIE_SECURE: ${WHARF_COOKIE_SECURE:-false}
      # Optional: a URL to POST a JSON payload to when an instance's cpu/memory
      # usage crosses a threshold (checked once per scheduler tick, alongside
      # scheduled backups) or a query runs longer than WHARF_ALERT_SLOW_QUERY_MS
      # (default 5000). Off entirely unless set. Thresholds/cooldown are each
      # independently overridable: WHARF_ALERT_CPU_THRESHOLD_PERCENT,
      # WHARF_ALERT_MEMORY_THRESHOLD_PERCENT (both default 90),
      # WHARF_ALERT_COOLDOWN_MINUTES (default 30, per instance per alert type).
      WHARF_ALERT_WEBHOOK_URL: ${WHARF_ALERT_WEBHOOK_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wharf-control-plane-data:/data
    restart: unless-stopped

  web:
    image: ghcr.io/${WHARF_IMAGE_OWNER:-drk1rd}/wharf-web:${WHARF_VERSION:-latest}
    ports:
      - "5173:80"
    depends_on:
      - control-plane
    restart: unless-stopped

volumes:
  wharf-control-plane-data:
